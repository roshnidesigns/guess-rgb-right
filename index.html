<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CAN U GUESS THE COLOR!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="colorguess.css">
</head>

<body>
    <div id="title">The most amusing guessing game ever!</div>
    <h1>
        <span id="prompt">Can you guess this color?</span>
        <br>
        <span id="rgb">RGB</span>
    </h1>
    <div id="boxes">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
    <div id="controls">
        <span id="message"></span>
        <div id="modes">
            <button id="easy">EASY</button>
            <button id="hard" class="selected">HARD</button>
        </div>
        <button id="new-colors">NEW COLORS</button>
        <span id="hint">or press spacebar</span>
    </div>
    <script src="colorguess.js"></script>
</body>

</html>
