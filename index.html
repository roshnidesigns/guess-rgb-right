<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Guess RGB Right</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="colorguess.css">
</head>

<body>
    <header>
        <div id="title">The most amusing guessing game ever!</div>
        <h1>
            <span id="prompt">Can you guess this color?</span>
            <span id="rgb">RGB</span>
        </h1>
    </header>
    <div id="boxes">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
    <div id="controls">
        <div id="hud" hidden>
            <span><span id="time"></span><small>s</small></span>
            <span id="score"></span>
        </div>
        <span id="message" aria-live="polite"></span>
        <div id="modes">
            <label><input type="radio" name="difficulty" id="easy"> Easy</label>
            <label><input type="radio" name="difficulty" id="hard" checked> Hard</label>
        </div>
        <div id="actions">
            <button id="rush" aria-pressed="false">
                <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                    <circle cx="12" cy="13" r="8" />
                    <path d="M12 9v4l2.5 2.5M9 2h6" />
                </svg>
                Rush Mode
            </button>
            <button id="new-colors">NEW COLORS</button>
        </div>
        <span id="hint">or press spacebar</span>
    </div>
    <script src="colorguess.js"></script>
</body>

</html>
